name: FitnessAPI rollback
on:
  workflow_dispatch:
    inputs:
      revision:
        description: SHA of a previously published and working release
        type: string
        required: true

permissions:
  contents: read

jobs:
  rollback:
    if: github.ref == 'refs/heads/lr7-dz8'
    runs-on: ubuntu-latest
    environment: fitnessapi-cloud
    concurrency:
      group: fitnessapi-cloud-deploy
      cancel-in-progress: false
    steps:
      - name: Restore version in K3s
        env:
          REVISION: ${{ inputs.revision }}
          REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}
          DEPLOY_HOST: ${{ vars.FITNESSAPI_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.FITNESSAPI_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.FITNESSAPI_DEPLOY_KEY }}
          HOST_KEYS: ${{ secrets.FITNESSAPI_SSH_KNOWN_HOSTS }}
          SMOKE_URL: ${{ vars.FITNESSAPI_SMOKE_URL }}
        run: |
          [[ "$REGISTRY_ID" =~ ^[a-z0-9]+$ && "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_KEY"
          test -n "$HOST_KEYS"
          test -n "$SMOKE_URL"
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$HOST_KEYS" > "$ssh_dir/known_hosts"
          ssh -i "$ssh_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$REGISTRY_ID" "$REVISION" <<'REMOTE'
          set -euo pipefail
          k=(kubectl --kubeconfig "$HOME/.kube/fitnessapi-cd" -n fitnessapi)
          for service in user-service media-service training-service blog-service progress-service; do
            "${k[@]}" set image "deployment/$service" "$service=cr.yandex/$1/$service:$2"
            "${k[@]}" rollout status "deployment/$service" --timeout=420s
          done
          REMOTE
          curl -fsS --retry 4 --retry-delay 3 --max-time 15 "$SMOKE_URL" >/dev/null
